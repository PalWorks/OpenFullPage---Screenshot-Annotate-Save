<!doctype html>
<meta charset="utf-8">
<title>Page Frame, Same Origin</title>
<!-- A shell one window tall around a frame that fills it, the way Google serves
     its forms. Nothing here scrolls; the frame's own document does. -->
<style>
  body { margin: 0; height: 100%; }
  html { overflow: hidden; }
  iframe { position: absolute; border: 0; width: 100%; height: 100vh; }
</style>
<iframe src="/frame.html"></iframe>
